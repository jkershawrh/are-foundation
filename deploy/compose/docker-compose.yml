services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: are
      POSTGRES_PASSWORD: are
      POSTGRES_DB: are
    ports:
      - "54329:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U are -d are"]
      interval: 2s
      timeout: 2s
      retries: 20

  local-jwks:
    image: nginx:1.27-alpine
    volumes:
      - ./jwks/jwks.json:/usr/share/nginx/html/.well-known/jwks.json:ro
    ports:
      - "8088:80"

  opa-s0s1-eval:
    image: openpolicyagent/opa:0.70.0
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policy"]
    volumes:
      - ../../sx/s0s1-rest-bff/policy:/policy:ro
    ports:
      - "8181:8181"

  s0s1-rest-bff:
    build:
      context: ../..
      dockerfile: sx/s0s1-rest-bff/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      opa-s0s1-eval:
        condition: service_started
    environment:
      ARE_S0S1_TLS_CERT_FILE: /tls/foundation.crt
      ARE_S0S1_TLS_KEY_FILE: /tls/foundation.key
      ARE_S0S1_TLS_CA_FILE: /tls/ca.crt
      ARE_S0S1_DATABASE_URL: postgres://are:are@postgres:5432/are?sslmode=disable
      ARE_S0S1_OPA_URL: http://opa-s0s1-eval:8181
      ARE_S0S1_S0_DELEGATE: "0"
      ARE_DEPLOYMENT_STAGE: stage-s0s1
    volumes:
      - ./tls:/tls:ro
    ports:
      - "8443:8443"
      - "8099:8099"

  are-api-gateway:
    build:
      context: ../..
      dockerfile: sx/are-api-gateway/Dockerfile
      args:
        GO_BUILD_TAGS: dev
    depends_on:
      - local-jwks
      - s0s1-rest-bff
    environment:
      ARE_GW_TLS_CERT_FILE: /tls/foundation.crt
      ARE_GW_TLS_KEY_FILE: /tls/foundation.key
      ARE_GW_TLS_CA_FILE: /tls/ca.crt
      ARE_GW_JWKS_URL: http://local-jwks/.well-known/jwks.json
      ARE_GW_DEV_UNSAFE_MODE: "true"
      ARE_GW_ALLOW_INSECURE_TEST_TOKEN: "true"
      ARE_GW_ENABLE_INSECURE_CONFORMANCE: "true"
      ARE_GW_S0S1_HTTP_PROXY_BASE: https://s0s1-rest-bff:8443
      ARE_GW_S0S1_HTTP_TLS_SERVER_NAME: s0s1-rest-bff
      ARE_GW_UPSTREAM_MODE: mixed
      ARE_GATEWAY_METRICS_ALLOW_ANONYMOUS: "true"
      ARE_DEPLOYMENT_STAGE: stage-s0s1
    volumes:
      - ./tls:/tls:ro
    ports:
      - "18085:8085"
      - "18086:8080"
      - "18090:8090"

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
    profiles:
      - kafka
      - full

  redpanda-console:
    image: redpandadata/console:v2.7
    environment:
      KAFKA_BROKERS: kafka:9092
    ports:
      - "18088:8080"
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - kafka
      - full

  are-agent-registry:
    build:
      context: ../..
      dockerfile: s0/agent-registry-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ARE_DB_CONNECTION_STRING: postgres://are:are@postgres:5432/are?sslmode=disable
      ARE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARE_KAFKA_SASL_USERNAME: unused
      ARE_KAFKA_SASL_PASSWORD: unused
      ARE_KAFKA_TOPIC_LIFECYCLE: are.agents.lifecycle
      ARE_GRPC_PORT: "9090"
      ARE_HEALTH_PORT: "8080"
      ARE_METRICS_PORT: "8081"
    ports:
      - "19090:9090"
      - "19080:8080"
      - "19081:8081"
    profiles:
      - kafka
      - full
